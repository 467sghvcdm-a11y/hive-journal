<style>
  :root {
    --honey: #C8860A; --honey-light: #F5D280; --bark: #3D2B1F; --bark-mid: #6B4C38;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .tab { font-size: 13px; font-weight: 500; color: var(--bark-light); background: transparent; border: none; padding: 10px 15px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: 'Instrument Sans', sans-serif; }

  main { padding: 1.1rem 1.5rem; max-width: 780px; margin: 0 auto; }

<script>
const ENTRANCE_OPTS = ['No traffic','Light traffic','Steady traffic','Heavy traffic','Pollen coming in','Orientation flights','Bees clustering outside','Robbing activity','Unusual stillness'];

const SEED = [
  { id:'seed-1', date:'2026-04-16', type:'install', queen:'Caged — candy exposed (discovered corked, fixed Apr 17)', temp:'Very calm', syrup:'Two full jars installed', entrance:'Orientation flights', notes:'OHB Golden West package installed. Bees shaken into Box 1. Queen cage (JZ-BZ style) hung via toothpick method across Warré bars in Box 2. Candy plug inadvertently left corked at install — discovered and corrected next day.', pests:'None observed.' },
  { id:'seed-2', date:'2026-04-17', type:'check', queen:'Caged — candy exposed', temp:'Calm', syrup:'', entrance:'Steady traffic', notes:'Discovered candy plug was still corked from install. Opened cloth above Box 2, pulled cage, removed cork, re-hung via toothpick with candy now fully exposed. Bees calm throughout. Queen release clock starts today.', pests:'' },
  { id:'seed-3', date:'2026-04-18', type:'maintenance', queen:'', temp:'Very calm', syrup:'Full jar', entrance:'Steady traffic', notes:'Reconfigured feeding setup. Canvas folded back halfway to expose top bars. Wooden feeder board with 3.5" hole installed directly over open hive. Single mason jar inverted into hole — bees now have direct access to lid without canvas barrier. Feeder box placed on top. Small gap between feeder box and second box sealed with strips of birch veneer. No screen on feeder board hole — jar installation requires care to avoid bee escape but manageable. Bees were very gentle throughout, no sting attempts, no agitation. First real handling impression of the Golden West bees — notably calm.', pests:'' },
  { id:'seed-4', date:'2026-04-20', type:'check', queen:'Released — confirmed', temp:'Calm', syrup:'75% full', entrance:'Steady traffic', notes:'Queen release confirmed. Candy fully consumed, cage empty. Bees had begun drawing comb cells on sides of the cage. Cage removed. Colony showed mild response to opening — some buzzing and flying but calm overall. Feeder board and cloth replaced. Approx 20 dead bees observed on ground outside hive — consistent with shipping casualties being cleared out.', pests:'' }
];

let allEntries = [];
let editingId = null;
const msState = { 'ms-entrance': [], 'ms-eentrance': [] };

function initMultiselects() {
  buildDropdown('ms-entrance', ENTRANCE_OPTS);
  buildDropdown('ms-eentrance', ENTRANCE_OPTS);
}

function buildDropdown(id, opts) {
  const dd = document.getElementById(id + '-dropdown');
  dd.innerHTML = '';
  opts.forEach(o => {
    const div = document.createElement('div');
    div.className = 'ms-option';
    div.innerHTML = '<div class="ms-check"></div>' + o;
    div.addEventListener('click', function(e) { e.stopPropagation(); toggleOpt(id, o); });
    dd.appendChild(div);
  });
}

function toggleDropdown(id) {
  const dd = document.getElementById(id + '-dropdown');
  const disp = document.getElementById(id + '-display');
  const isOpen = dd.classList.contains('open');
  document.querySelectorAll('.multiselect-dropdown.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.multiselect-display.open').forEach(d => d.classList.remove('open'));
  if (!isOpen) { dd.classList.add('open'); disp.classList.add('open'); }
}

function toggleOpt(id, val) {
  const arr = msState[id];
  const idx = arr.indexOf(val);
  if (idx === -1) arr.push(val); else arr.splice(idx, 1);
  refreshDropdown(id);
  refreshDisplay(id);
}

function refreshDropdown(id) {
  document.querySelectorAll('#' + id + '-dropdown .ms-option').forEach(opt => {
    const label = opt.textContent.trim();
    const sel = msState[id].includes(label);
    opt.classList.toggle('selected', sel);
    opt.querySelector('.ms-check').textContent = sel ? '✓' : '';
  });
}

function refreshDisplay(id) {
  const disp = document.getElementById(id + '-display');
  const arr = msState[id];
  if (!arr.length) { disp.innerHTML = '<span class="placeholder">Select...</span>'; return; }
  disp.innerHTML = '';
  arr.forEach(v => {
    const pill = document.createElement('span');
    pill.className = 'ms-pill';
    pill.textContent = v;
    const x = document.createElement('span');
    x.className = 'ms-pill-x';
    x.textContent = '×';
    x.addEventListener('click', function(e) { e.stopPropagation(); toggleOpt(id, v); });
    pill.appendChild(x);
    disp.appendChild(pill);
  });
}

function setMsValues(id, val) {
  msState[id] = val ? val.split(', ').filter(Boolean) : [];
  refreshDropdown(id);
  refreshDisplay(id);
}

function getMsValue(id) { return msState[id].join(', '); }

document.addEventListener('click', function(e) {
  if (!e.target.closest('.multiselect')) {
    document.querySelectorAll('.multiselect-dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.multiselect-display.open').forEach(d => d.classList.remove('open'));
  }
});

function atHeaders() {

async function loadEntries() {
  const list = document.getElementById('entries-list');
  list.innerHTML = '<div class="empty-state"><div class="big">🍯</div>Loading...</div>';
  try {
    const res = await fetch(AT_URL + '?sort[0][field]=date&sort[0][direction]=desc&pageSize=100', { headers: atHeaders() });
    const data = await res.json();
    if (data.records) {
      allEntries = data.records.map(r => ({ id: r.id, ...r.fields }));
      // Seed missing entries
      const existingDates = allEntries.map(e => e.date);
      const toSeed = SEED.filter(s => !existingDates.includes(s.date));
      for (const s of toSeed) {
        const r = await fetch(AT_URL, { method:'POST', headers: atHeaders(), body: JSON.stringify({ fields: { date:s.date, type:s.type, queen:s.queen||'', temp:s.temp||'', syrup:s.syrup||'', entrance:s.entrance||'', notes:s.notes||'', pests:s.pests||'', aiFeedback:s.aiFeedback||'' } }) });
        const rd = await r.json();
        if (rd.id) allEntries.push({ id: rd.id, ...rd.fields });
      }
    }
  } catch(e) { console.error('Load error:', e); }
  applyFilters();
}

async function atCreate(fields) {
  const res = await fetch(AT_URL, { method:'POST', headers: atHeaders(), body: JSON.stringify({ fields }) });
  const data = await res.json();
  return data.id ? { id: data.id, ...data.fields } : null;
}

async function atUpdate(id, fields) {
  await fetch(AT_URL + '/' + id, { method:'PATCH', headers: atHeaders(), body: JSON.stringify({ fields }) });
}

async function atDelete(id) {
  await fetch(AT_URL + '/' + id, { method:'DELETE', headers: atHeaders() });
}

function showSaveError() {
  const msg = document.getElementById('save-msg');
  msg.style.display = 'flex'; msg.style.color = '#B84040';
  msg.textContent = '✗ Save failed';
  setTimeout(() => { msg.style.display = 'none'; msg.style.color = ''; msg.textContent = '✓ Saved'; }, 3000);
}

function applyFilters() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const period = document.getElementById('filter-period').value;
  const now = new Date();
  let filtered = allEntries.filter(e => {
    if (period === 'week') { const d = new Date(e.date+'T12:00:00'); const sow = new Date(now); sow.setDate(now.getDate()-now.getDay()); sow.setHours(0,0,0,0); if (d < sow) return false; }
    else if (period === 'month') { const d = new Date(e.date+'T12:00:00'); if (d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear()) return false; }
    else if (period === 'year') { const d = new Date(e.date+'T12:00:00'); if (d.getFullYear()!==now.getFullYear()) return false; }
    if (q) { const hay = [e.notes,e.queen,e.temp,e.syrup,e.entrance,e.pests,e.type,e.date].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  document.getElementById('result-count').textContent = filtered.length === allEntries.length ? allEntries.length+' entries' : filtered.length+' of '+allEntries.length+' entries';
  renderEntries(filtered);
}

function renderEntries(entries) {
  const list = document.getElementById('entries-list');
  if (!entries.length) { list.innerHTML = '<div class="empty-state"><div class="big">🍯</div>No entries match.</div>'; return; }
  const sorted = [...entries].sort((a,b) => new Date(b.date)-new Date(a.date));
  list.innerHTML = sorted.map(e => `
    <div class="entry-card">
      <div class="entry-inner">
        <div class="entry-top">
          <div class="entry-date">${fmtDate(e.date)}</div>
          <div class="entry-badges"><span class="badge badge-${e.type}">${e.type}</span><button class="btn-edit" onclick="openEdit('${e.id}')">edit</button></div>
        </div>
        <div class="entry-body">${esc(e.notes)}</div>
        <div class="entry-meta">
          ${e.queen?`<div class="meta-chip">Queen: <b>${esc(e.queen)}</b></div>`:''}
          ${e.temp?`<div class="meta-chip">Temperament: <b>${esc(e.temp)}</b></div>`:''}
          ${e.syrup?`<div class="meta-chip">Feeding: <b>${esc(e.syrup)}</b></div>`:''}
          ${e.entrance?`<div class="meta-chip">Entrance: <b>${esc(e.entrance)}</b></div>`:''}
          ${e.pests?`<div class="meta-chip">Pests: <b>${esc(e.pests)}</b></div>`:''}
        </div>
      </div>

    </div>`).join('');
}


async function saveEntry() {
  const date = document.getElementById('f-date').value;
  const notes = document.getElementById('f-notes').value.trim();
  if (!date) { alert('Date is required.'); return; }
  const fields = { date, type:document.getElementById('f-type').value, queen:document.getElementById('f-queen').value, temp:document.getElementById('f-temp').value, syrup:document.getElementById('f-syrup').value, entrance:getMsValue('ms-entrance'), notes, pests:document.getElementById('f-pests').value.trim() };
  const msg = document.getElementById('save-msg');
  msg.style.display = 'flex'; msg.textContent = 'Saving...';
  try {
    const newEntry = await atCreate(fields);
    if (!newEntry) { showSaveError(); return; }
    allEntries.push(newEntry);
    document.getElementById('f-notes').value=''; document.getElementById('f-pests').value=''; document.getElementById('f-queen').value=''; document.getElementById('f-temp').value=''; document.getElementById('f-syrup').value=''; setMsValues('ms-entrance','');
    msg.textContent = '✓ Saved';
    setTimeout(async()=>{ msg.style.display='none'; hideAddForm(); applyFilters(); }, 900);
  } catch(e) { showSaveError(); }
}

function openEdit(id) {
  const e = allEntries.find(x=>x.id===id);
  if (!e) return;
  editingId = id;
  document.getElementById('e-date').value = e.date;
  document.getElementById('e-type').value = e.type;
  document.getElementById('e-queen').value = e.queen||'';
  document.getElementById('e-temp').value = e.temp||'';
  document.getElementById('e-syrup').value = e.syrup||'';
  document.getElementById('e-notes').value = e.notes||'';
  document.getElementById('e-pests').value = e.pests||'';
  setMsValues('ms-eentrance', e.entrance||'');
  document.getElementById('edit-modal').classList.add('open');
}

async function saveEdit() {
  const idx = allEntries.findIndex(x=>x.id===editingId);
  if (idx===-1) return;
  const fields = { date:document.getElementById('e-date').value, type:document.getElementById('e-type').value, queen:document.getElementById('e-queen').value, temp:document.getElementById('e-temp').value, syrup:document.getElementById('e-syrup').value, entrance:getMsValue('ms-eentrance'), notes:document.getElementById('e-notes').value.trim(), pests:document.getElementById('e-pests').value.trim() };
  try {
    await atUpdate(editingId, fields);
    allEntries[idx] = { ...allEntries[idx], ...fields };
    closeModal(); applyFilters();
  } catch(e) { alert('Could not save changes. Try again.'); }
}

async function deleteEntry() {
  if (!confirm('Delete this entry?')) return;
  try {
    await atDelete(editingId);
    allEntries = allEntries.filter(x=>x.id!==editingId);
    closeModal(); applyFilters();
  } catch(e) { alert('Could not delete. Try again.'); }
}

function closeModal() { document.getElementById('edit-modal').classList.remove('open'); editingId=null; }


function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function switchTab(name){document.getElementById('tab-log').style.display=name==='log'?'block':'none';document.getElementById('tab-add').style.display=name==='add'?'block':'none';}
function showAddForm(){document.getElementById('tab-log').style.display='none';document.getElementById('tab-add').style.display='block';window.scrollTo(0,0);}
function hideAddForm(){document.getElementById('tab-log').style.display='block';document.getElementById('tab-add').style.display='none';}
document.getElementById('edit-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
const _now = new Date();
document.getElementById('f-date').value = _now.getFullYear() + '-' + String(_now.getMonth()+1).padStart(2,'0') + '-' + String(_now.getDate()).padStart(2,'0');
initMultiselects();
loadEntries();
</script>
